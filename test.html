<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StructureMind - smoke testy eksportu</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#0b0f17;
      --panel:#121a2c;
      --text:#e8eefc;
      --muted:#9aa6c3;
      --ok:#34d399;
      --bad:#fb7185;
      --border:rgba(255,255,255,.12);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#0b0f17,#101827);
      padding:24px;
    }
    main{
      max-width:980px;
      margin:0 auto;
      display:grid;
      gap:16px;
    }
    .panel{
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--panel);
      padding:16px;
      box-shadow:0 16px 50px rgba(0,0,0,.28);
    }
    h1{
      margin:0 0 4px;
      font-size:20px;
    }
    p{
      margin:0;
      color:var(--muted);
    }
    #results{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      gap:8px;
    }
    #results li{
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 12px;
      background:rgba(255,255,255,.04);
    }
    #results li.pass{ border-color:rgba(52,211,153,.45); color:var(--ok); }
    #results li.fail{ border-color:rgba(251,113,133,.45); color:var(--bad); }
    iframe{
      width:100%;
      height:620px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#0b0f17;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Smoke testy eksportu</h1>
      <p id="summary">Uruchamianie...</p>
    </section>
    <section class="panel">
      <ul id="results"></ul>
    </section>
    <iframe id="appFrame" src="index.html" title="StructureMind"></iframe>
  </main>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("appFrame");
      const results = document.getElementById("results");
      const summary = document.getElementById("summary");
      const downloads = [];
      const blobByUrl = new Map();

      function addResult(name, ok, details=""){
        const item = document.createElement("li");
        item.className = ok ? "pass" : "fail";
        item.textContent = `${ok ? "PASS" : "FAIL"} - ${name}${details ? `: ${details}` : ""}`;
        results.appendChild(item);
      }

      function assert(condition, message){
        if (!condition) throw new Error(message);
      }

      function wait(ms){
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function waitFor(check, timeout=3000){
        const start = performance.now();
        while (performance.now() - start < timeout){
          const value = check();
          if (value) return value;
          await wait(50);
        }
        throw new Error("Przekroczono limit czasu oczekiwania.");
      }

      function inputEditor(win, value){
        const editor = win.document.getElementById("editor");
        editor.value = value;
        editor.dispatchEvent(new win.Event("input", { bubbles:true }));
      }

      function click(win, id){
        win.document.getElementById(id).click();
      }

      function installDownloadCapture(win){
        let urlId = 0;
        const originalClick = win.HTMLAnchorElement.prototype.click;

        win.URL.createObjectURL = (blob) => {
          const url = `blob:structuremind-test-${++urlId}`;
          blobByUrl.set(url, blob);
          return url;
        };
        win.URL.revokeObjectURL = (url) => {
          blobByUrl.delete(url);
        };
        win.HTMLAnchorElement.prototype.click = function(){
          if (this.download){
            downloads.push({
              filename: this.download,
              href: this.href,
              blob: blobByUrl.get(this.href)
            });
            return;
          }
          return originalClick.call(this);
        };
      }

      async function runTest(name, fn){
        try{
          await fn();
          addResult(name, true);
          return true;
        } catch (error){
          addResult(name, false, error.message);
          return false;
        }
      }

      async function run(){
        await new Promise(resolve => frame.addEventListener("load", resolve, { once:true }));
        const win = frame.contentWindow;
        installDownloadCapture(win);
        await waitFor(() => win.document.querySelectorAll(".node").length >= 1);
        await wait(120);

        const checks = [];

        checks.push(await runTest("przyciski eksportu są dostępne", async () => {
          assert(win.document.getElementById("btnExportTxt")?.textContent.trim() === "Zapisz TXT", "Brak przycisku Zapisz TXT.");
          assert(win.document.getElementById("btnExportPng")?.textContent.trim() === "Zapisz PNG", "Brak przycisku Zapisz PNG.");
        }));

        checks.push(await runTest("TXT pobiera dokładną treść edytora", async () => {
          downloads.length = 0;
          const source = "Root\n  Child\n    Leaf\n";
          inputEditor(win, source);
          await wait(120);
          click(win, "btnExportTxt");
          await waitFor(() => downloads.length === 1);
          const download = downloads[0];
          assert(download.filename === "structuremind-map.txt", "Niepoprawna nazwa pliku TXT.");
          assert(download.blob, "Nie przechwycono bloba TXT.");
          assert(await download.blob.text() === source, "Treść TXT różni się od edytora.");
        }));

        checks.push(await runTest("pusty edytor blokuje TXT", async () => {
          downloads.length = 0;
          inputEditor(win, "  \n\t");
          await wait(120);
          click(win, "btnExportTxt");
          await wait(120);
          assert(downloads.length === 0, "Pusty TXT nie powinien zostać pobrany.");
          assert(win.document.getElementById("statusMsg").textContent.includes("TXT zablokowany"), "Brak komunikatu blokady TXT.");
        }));

        checks.push(await runTest("PNG pobiera obraz pełnej mapy", async () => {
          downloads.length = 0;
          inputEditor(win, "Root\n  Child A\n  Child B");
          await wait(120);
          click(win, "btnExportPng");
          await waitFor(() => downloads.length === 1);
          const download = downloads[0];
          assert(download.filename === "structuremind-map.png", "Niepoprawna nazwa pliku PNG.");
          assert(download.blob?.type === "image/png", "Plik nie ma typu image/png.");
          assert(download.blob.size > 1000, "PNG jest podejrzanie mały.");
          const signature = new Uint8Array(await download.blob.slice(0, 8).arrayBuffer());
          assert(Array.from(signature).join(",") === "137,80,78,71,13,10,26,10", "Niepoprawna sygnatura PNG.");
          const bitmap = await createImageBitmap(download.blob);
          assert(bitmap.width > 128 && bitmap.height > 128, "PNG nie zawiera oczekiwanego marginesu i mapy.");
          bitmap.close();
        }));

        checks.push(await runTest("pusta mapa blokuje PNG", async () => {
          downloads.length = 0;
          inputEditor(win, "\n   ");
          await wait(120);
          click(win, "btnExportPng");
          await wait(120);
          assert(downloads.length === 0, "Pusta mapa nie powinna zostać pobrana.");
          assert(win.document.getElementById("statusMsg").textContent.includes("PNG zablokowany"), "Brak komunikatu blokady PNG.");
        }));

        const passed = checks.filter(Boolean).length;
        summary.textContent = `${passed}/${checks.length} testów zakończonych powodzeniem.`;
        if (passed !== checks.length){
          document.title = "StructureMind - testy nie przeszły";
          throw new Error("Smoke testy nie przeszły.");
        }
        document.title = "StructureMind - testy przeszły";
      }

      run().catch((error) => {
        summary.textContent = error.message;
        console.error(error);
      });
    })();
  </script>
</body>
</html>
